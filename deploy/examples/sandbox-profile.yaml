apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: shell
  namespace: serverless-harness
spec:
  # Context Service adds the selected workspace at /workspace.
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        context.rossoctl.io/profile: shell
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          workingDir: /workspace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
