apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-service
  namespace: serverless-harness
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: context-service
  namespace: serverless-harness
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: context-service
  namespace: serverless-harness
subjects:
  - kind: ServiceAccount
    name: context-service
    namespace: serverless-harness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: context-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: context-service-workspaces
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "delete"]
  # Short-lived upload and export helper Pods mount one Context PVC each.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: context-service-workspaces
subjects:
  - kind: ServiceAccount
    name: context-service
    namespace: serverless-harness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: context-service-workspaces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-service
  namespace: serverless-harness
  labels:
    app.kubernetes.io/name: context-service
spec:
  # Upload capabilities and per-Context upload locks live in memory; keep one replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: context-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: context-service
    spec:
      serviceAccountName: context-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: context-service
          image: ghcr.io/rossoctl/context-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CS_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: context-service-control-plane
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: context-service
  namespace: serverless-harness
  labels:
    app.kubernetes.io/name: context-service
spec:
  selector:
    app.kubernetes.io/name: context-service
  ports:
    - name: http
      port: 8080
      targetPort: http
