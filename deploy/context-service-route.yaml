apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: context-service
  namespace: serverless-harness
spec:
  hostnames:
    - serverless-harness.163-75-85-180.sslip.io
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http
      namespace: kagenti-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /context-service
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: context-service
          port: 8080
