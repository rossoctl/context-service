<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 single-user delegation and fan-out</title>
  <desc id="desc">A local agent follows the Moca delegation skill, uploads one verified context revision to Context Service, and asks a Moca workload to fan out to many remote tasks, a hundred for example, before returning their results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .step { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .arrow-label { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="20" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">Upload context once, then fan out to many tasks, e.g. 100</text>

  <rect x="35" y="88" width="240" height="230" rx="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="128" text-anchor="middle" class="heading">Local agent</text>
  <rect x="65" y="150" width="180" height="46" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="155" y="179" text-anchor="middle" class="body">moca-delegate-task skill</text>
  <text x="155" y="229" text-anchor="middle" class="body">Select context</text>
  <text x="155" y="255" text-anchor="middle" class="body">Partition tasks</text>
  <text x="155" y="281" text-anchor="middle" class="body">Check returned results</text>

  <rect x="340" y="88" width="240" height="230" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="460" y="128" text-anchor="middle" class="heading">Context Service</text>
  <text x="460" y="173" text-anchor="middle" class="body">One verified revision</text>
  <text x="460" y="201" text-anchor="middle" class="body">Frozen for the workload</text>
  <text x="460" y="229" text-anchor="middle" class="body">Uploaded only once</text>

  <rect x="645" y="88" width="220" height="230" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="755" y="128" text-anchor="middle" class="heading">Moca workload</text>
  <text x="755" y="173" text-anchor="middle" class="body">Accepts bounded prompts</text>
  <text x="755" y="201" text-anchor="middle" class="body">Routes each task</text>
  <text x="755" y="229" text-anchor="middle" class="body">Tracks completion</text>

  <rect x="930" y="70" width="235" height="266" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1048" y="109" text-anchor="middle" class="heading">Remote agents</text>
  <rect x="960" y="137" width="175" height="42" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="960" y="190" width="175" height="42" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="960" y="243" width="175" height="42" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1048" y="163" text-anchor="middle" class="body">Task 1</text>
  <text x="1048" y="216" text-anchor="middle" class="body">Task 2</text>
  <text x="1048" y="269" text-anchor="middle" class="body">Task N · e.g. 100</text>
  <text x="1048" y="313" text-anchor="middle" class="body">Shared sandbox pool</text>

  <path d="M 275 190 H 335" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="305" y="169" text-anchor="middle" class="arrow-label">pack + upload</text>

  <path d="M 580 190 H 640" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="610" y="169" text-anchor="middle" class="arrow-label">frozen revision</text>

  <path d="M 865 190 H 925" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="895" y="169" text-anchor="middle" class="arrow-label">fan out</text>

  <path d="M 1038 336 C 905 403, 350 404, 168 322" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="610" y="364" text-anchor="middle" class="arrow-label">collect results</text>
</svg>
