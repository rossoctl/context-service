<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 multi-user workload isolation</title>
  <desc id="desc">Alice and Bob authenticate separately, upload separate Context Service revisions, and receive separate Moca workloads with private sandbox pods and volumes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .column { font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .boundary { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Each user gets an independently owned execution environment</text>

  <rect x="335" y="66" width="790" height="52" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="88" text-anchor="middle" class="heading">Moca verifies the caller; the provisioner creates and binds workload resources</text>
  <text x="730" y="107" text-anchor="middle" class="body">Context Service stores the frozen source revision · Moca owns sandboxes and workload storage</text>

  <text x="135" y="148" text-anchor="middle" class="column">IDENTITY</text>
  <text x="390" y="148" text-anchor="middle" class="column">CONTEXT SERVICE</text>
  <text x="650" y="148" text-anchor="middle" class="column">MOCA WORKLOAD</text>
  <text x="980" y="148" text-anchor="middle" class="column">ISOLATED ENVIRONMENT</text>

  <rect x="35" y="169" width="200" height="120" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="207" text-anchor="middle" class="heading">Alice</text>
  <text x="135" y="237" text-anchor="middle" class="body">Authenticated identity</text>
  <text x="135" y="263" text-anchor="middle" class="body">alice-repo</text>

  <rect x="290" y="169" width="200" height="120" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="207" text-anchor="middle" class="heading">Alice's context</text>
  <text x="390" y="237" text-anchor="middle" class="body">Frozen revision A</text>
  <text x="390" y="263" text-anchor="middle" class="body">Owned by Alice</text>

  <rect x="550" y="169" width="200" height="120" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="207" text-anchor="middle" class="heading">Workload A</text>
  <text x="650" y="237" text-anchor="middle" class="body">Owner-bound routing</text>
  <text x="650" y="263" text-anchor="middle" class="body">2 sandboxes · writable</text>

  <rect x="810" y="161" width="340" height="136" rx="15" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="980" y="194" text-anchor="middle" class="heading">Alice's environment</text>
  <rect x="836" y="214" width="90" height="54" rx="9" fill="#ffffff" stroke="#a78bfa"/>
  <rect x="938" y="214" width="90" height="54" rx="9" fill="#ffffff" stroke="#a78bfa"/>
  <rect x="1040" y="214" width="84" height="54" rx="9" fill="#ffffff" stroke="#a78bfa"/>
  <text x="881" y="246" text-anchor="middle" class="body">Sandbox 1</text>
  <text x="983" y="246" text-anchor="middle" class="body">Sandbox 2</text>
  <text x="1082" y="238" text-anchor="middle" class="body">Private</text>
  <text x="1082" y="256" text-anchor="middle" class="body">PVC A</text>

  <line x1="35" y1="321" x2="1150" y2="321" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="515" y="307" width="170" height="28" rx="14" fill="#f8fafc"/>
  <text x="600" y="326" text-anchor="middle" class="boundary">USER ISOLATION BOUNDARY</text>

  <rect x="35" y="353" width="200" height="120" rx="15" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="391" text-anchor="middle" class="heading">Bob</text>
  <text x="135" y="421" text-anchor="middle" class="body">Authenticated identity</text>
  <text x="135" y="447" text-anchor="middle" class="body">bob-repo</text>

  <rect x="290" y="353" width="200" height="120" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="391" text-anchor="middle" class="heading">Bob's context</text>
  <text x="390" y="421" text-anchor="middle" class="body">Frozen revision B</text>
  <text x="390" y="447" text-anchor="middle" class="body">Owned by Bob</text>

  <rect x="550" y="353" width="200" height="120" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="391" text-anchor="middle" class="heading">Workload B</text>
  <text x="650" y="421" text-anchor="middle" class="body">Owner-bound routing</text>
  <text x="650" y="447" text-anchor="middle" class="body">1 sandbox · read-only</text>

  <rect x="810" y="345" width="340" height="136" rx="15" fill="#cffafe" stroke="#0891b2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="980" y="378" text-anchor="middle" class="heading">Bob's environment</text>
  <rect x="866" y="398" width="112" height="54" rx="9" fill="#ffffff" stroke="#22d3ee"/>
  <rect x="990" y="398" width="112" height="54" rx="9" fill="#ffffff" stroke="#22d3ee"/>
  <text x="922" y="430" text-anchor="middle" class="body">Sandbox 1</text>
  <text x="1046" y="422" text-anchor="middle" class="body">Private</text>
  <text x="1046" y="440" text-anchor="middle" class="body">PVC B</text>

  <path d="M 235 229 H 285" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 490 229 H 545" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 750 229 H 805" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 235 413 H 285" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 490 413 H 545" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 750 413 H 805" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
