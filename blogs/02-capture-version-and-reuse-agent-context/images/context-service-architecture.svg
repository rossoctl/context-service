<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">How Context Service works</title>
  <desc id="desc">Agent harnesses are captured into a local context store holding state, revisions, and derived memory and knowledge. Sync, continuous backup, and portable bundles move that context to PVC storage on Kubernetes or S3-compatible storage. Access grants control sharing across all of it. Numbers 1, 2, and 3 match the three capabilities: capture and transport, history, and derived memory and knowledge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; font-size: 26px; fill: #0f172a; }
      .col { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #64748b; }
      .heading { font-weight: 700; font-size: 18px; fill: #172554; }
      .body { font-size: 15px; fill: #334155; }
      .chip { font-size: 14px; fill: #0f172a; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #334155; }
      .label { font-weight: 650; font-size: 14px; fill: #334155; }
      .num { font-weight: 700; font-size: 13px; fill: #ffffff; }
      .rail { font-weight: 650; font-size: 17px; fill: #172554; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="20" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" class="title">How Context Service works</text>

  <text x="150" y="92" text-anchor="middle" class="col">AGENTS</text>
  <text x="600" y="92" text-anchor="middle" class="col">CONTEXT SERVICE</text>
  <text x="1050" y="92" text-anchor="middle" class="col">STORAGE</text>

  <!-- agents -->
  <g>
    <rect x="60" y="110" width="180" height="48" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="140" text-anchor="middle" class="chip">Claude Code</text>
    <rect x="60" y="170" width="180" height="48" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="200" text-anchor="middle" class="chip">Codex</text>
    <rect x="60" y="230" width="180" height="48" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="260" text-anchor="middle" class="chip">OpenCode</text>
    <rect x="60" y="290" width="180" height="48" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="320" text-anchor="middle" class="chip">Pi</text>
  </g>
  <path d="M 245 224 H 345" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="295" y="210" text-anchor="middle" class="label">capture</text>
  <text x="295" y="250" text-anchor="middle" class="label">restore</text>

  <!-- core -->
  <rect x="350" y="108" width="500" height="232" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="600" y="140" text-anchor="middle" class="heading">Named contexts</text>
  <text x="600" y="162" text-anchor="middle" class="mono">contextctl · ~/.contexts</text>
  <rect x="372" y="180" width="146" height="140" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="445" y="212" text-anchor="middle" class="heading">State</text>
  <text x="445" y="242" text-anchor="middle" class="body">Agent sessions</text>
  <text x="445" y="264" text-anchor="middle" class="body">and workspace</text>
  <text x="445" y="286" text-anchor="middle" class="body">files</text>
  <rect x="527" y="180" width="146" height="140" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" class="heading">Revisions</text>
  <text x="600" y="242" text-anchor="middle" class="body">Snapshots,</text>
  <text x="600" y="264" text-anchor="middle" class="body">clones, and</text>
  <text x="600" y="286" text-anchor="middle" class="body">lineage</text>
  <rect x="682" y="180" width="146" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="212" text-anchor="middle" class="heading">Derived</text>
  <text x="755" y="242" text-anchor="middle" class="body">Memory and</text>
  <text x="755" y="264" text-anchor="middle" class="body">searchable</text>
  <text x="755" y="286" text-anchor="middle" class="body">knowledge</text>

  <circle cx="390" cy="198" r="11" fill="#7c3aed"/><text x="390" y="203" text-anchor="middle" class="num">1</text>
  <circle cx="543" cy="198" r="11" fill="#d97706"/><text x="543" y="203" text-anchor="middle" class="num">2</text>
  <circle cx="700" cy="198" r="11" fill="#16a34a"/><text x="700" y="203" text-anchor="middle" class="num">3</text>
  <circle cx="295" cy="229" r="11" fill="#7c3aed"/><text x="295" y="234" text-anchor="middle" class="num">1</text>

  <!-- transport -->
  <path d="M 855 224 H 945" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="900" y="186" text-anchor="middle" class="label">sync</text>
  <text x="900" y="206" text-anchor="middle" class="label">backup</text>
  <text x="900" y="252" text-anchor="middle" class="label">.context</text>
  <text x="900" y="270" text-anchor="middle" class="label">bundles</text>

  <circle cx="900" cy="229" r="11" fill="#7c3aed"/><text x="900" y="234" text-anchor="middle" class="num">1</text>

  <!-- storage -->
  <rect x="950" y="110" width="200" height="104" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1050" y="148" text-anchor="middle" class="heading">PVC storage</text>
  <text x="1050" y="174" text-anchor="middle" class="body">Near Kubernetes</text>
  <text x="1050" y="194" text-anchor="middle" class="body">workloads</text>
  <rect x="950" y="234" width="200" height="104" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1050" y="272" text-anchor="middle" class="heading">S3-compatible</text>
  <text x="1050" y="298" text-anchor="middle" class="body">Independent</text>
  <text x="1050" y="318" text-anchor="middle" class="body">durable copy</text>

  <!-- sharing -->
  <rect x="60" y="390" width="1090" height="56" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="605" y="424" text-anchor="middle" class="rail">In a shared cluster, access grants decide who can read, write, attach, or derive from each context</text>
</svg>
