services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: context-service
      MINIO_ROOT_PASSWORD: context-service-demo
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio-data:/data

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 context-service context-service-demo; do sleep 1; done
        mc mb --ignore-existing local/contexts

volumes:
  minio-data:
