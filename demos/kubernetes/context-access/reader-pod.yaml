apiVersion: v1
kind: Pod
metadata:
  name: context-reader
  namespace: serverless-harness
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: context
          mountPath: /context
          readOnly: true
  volumes:
    - name: context
      persistentVolumeClaim:
        claimName: context-private
