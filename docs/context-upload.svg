<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Context upload flow</title>
  <desc id="desc">Moca creates a Context and requests a one-time upload capability. The local helper uploads the bundle directly to Context Service, where a temporary helper Pod validates and writes the revision to the Context PVC. Moca then freezes the revision and receives the verified PVC attachment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .note { font-size: 12px; fill: #1f2937; }
    .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
    .step circle { fill: #1f2937; }
    .step text { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="1080" height="530" rx="12" fill="#ffffff"/>

  <!-- Moca -->
  <rect class="box" x="20" y="60" width="220" height="260" rx="10" fill="#fff4e5" stroke="#d08c2c"/>
  <text class="title" x="130" y="182" text-anchor="middle">Moca</text>
  <text class="sub" x="130" y="202" text-anchor="middle">authenticates and authorizes</text>

  <!-- Local helper -->
  <rect class="box" x="20" y="400" width="220" height="90" rx="10" fill="#eef4ff" stroke="#4a6fa5"/>
  <text class="title" x="130" y="438" text-anchor="middle">Local helper</text>
  <text class="api" x="130" y="458" text-anchor="middle" style="fill: #6b7280;">remote_task.py</text>

  <!-- Context Service boundary -->
  <rect class="box" x="500" y="20" width="560" height="480" rx="14" fill="#f4fbf6" stroke="#3c8d5a"/>
  <text class="title" x="524" y="50">Context Service</text>

  <rect class="box" x="520" y="70" width="200" height="240" rx="10" fill="#ffffff" stroke="#3c8d5a"/>
  <text class="title" x="620" y="178" text-anchor="middle">Upload API</text>
  <text class="sub" x="620" y="198" text-anchor="middle">binds each token</text>
  <text class="sub" x="620" y="214" text-anchor="middle">to one Context PVC</text>

  <rect class="box" x="830" y="70" width="210" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="title" x="935" y="110" text-anchor="middle">Upload helper Pod</text>
  <text class="sub" x="935" y="130" text-anchor="middle">validates and expands</text>
  <text class="sub" x="935" y="148" text-anchor="middle">deleted after upload</text>

  <path class="box" d="M830,380 v58 a105,12 0 0,0 210,0 v-58" fill="#eaf7ee" stroke="#3c8d5a"/>
  <ellipse class="box" cx="935" cy="380" rx="105" ry="12" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="935" y="416" text-anchor="middle">Context PVC</text>
  <text class="sub" x="935" y="434" text-anchor="middle">immutable revisions</text>

  <!-- Moca <-> Upload API -->
  <line class="line" x1="240" y1="90" x2="518" y2="90"/>
  <g class="step"><circle cx="262" cy="90" r="10"/><text x="262" y="90">1</text></g>
  <text class="api" x="280" y="84">POST /internal/v1/contexts</text>
  <text class="sub" x="280" y="106">create Context and PVC</text>

  <line class="line" x1="240" y1="136" x2="518" y2="136"/>
  <g class="step"><circle cx="262" cy="136" r="10"/><text x="262" y="136">2</text></g>
  <text class="api" x="280" y="130">POST {ctx}/upload-capabilities</text>
  <text class="sub" x="280" y="152">request upload capability</text>

  <line class="line reply" x1="518" y1="182" x2="242" y2="182"/>
  <g class="step"><circle cx="262" cy="182" r="10"/><text x="262" y="182">3</text></g>
  <text class="api" x="280" y="176">201 uploadUrl + token</text>
  <text class="sub" x="280" y="198">one use, expires in 5 min</text>

  <line class="line" x1="240" y1="228" x2="518" y2="228"/>
  <g class="step"><circle cx="262" cy="228" r="10"/><text x="262" y="228">7</text></g>
  <text class="api" x="280" y="222">POST /internal{ctx}/freeze</text>
  <text class="sub" x="280" y="244">freeze the uploaded revision</text>

  <line class="line reply" x1="518" y1="274" x2="242" y2="274"/>
  <g class="step"><circle cx="262" cy="274" r="10"/><text x="262" y="274">8</text></g>
  <text class="api" x="280" y="268">200 revision + attachment</text>
  <text class="sub" x="280" y="290">verified PVC attachment</text>

  <!-- Moca hands the capability to the helper -->
  <line class="line reply" x1="130" y1="320" x2="130" y2="398"/>
  <g class="step"><circle cx="130" cy="345" r="10"/><text x="130" y="345">3</text></g>
  <text class="note" x="148" y="349">upload URL + token</text>
  <text class="sub" x="148" y="365">no service token or PVC name</text>

  <!-- Helper -> Upload API (direct upload) -->
  <path class="line" d="M240,445 H600 V312"/>
  <g class="step"><circle cx="262" cy="445" r="10"/><text x="262" y="445">4</text></g>
  <text class="api" x="280" y="439">PUT /v1/uploads/{id}</text>
  <text class="sub" x="280" y="461">Bearer token + .context bundle</text>

  <!-- Upload API <-> helper Pod -->
  <line class="line" x1="720" y1="105" x2="828" y2="105"/>
  <g class="step"><circle cx="742" cy="105" r="10"/><text x="742" y="105">5</text></g>
  <text class="note" x="758" y="99">stream</text>

  <line class="line reply" x1="828" y1="150" x2="722" y2="150"/>
  <g class="step"><circle cx="742" cy="150" r="10"/><text x="742" y="150">6</text></g>
  <text class="note" x="758" y="144">digest</text>

  <!-- helper Pod -> PVC -->
  <line class="line" x1="935" y1="180" x2="935" y2="366"/>
  <g class="step"><circle cx="935" cy="230" r="10"/><text x="935" y="230">5</text></g>
  <text class="note" x="953" y="234">write revision</text>

  <text class="api" x="20" y="520" style="font-size: 11px; fill: #6b7280;">{ctx} = /v1/namespaces/{ns}/contexts/{name}</text>
</svg>
