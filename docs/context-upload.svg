<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Context upload and bundle export flow</title>
  <desc id="desc">Moca creates a Context and requests a one-time upload capability. The client uploads the bundle directly to Context Service, where a temporary helper Pod validates and writes the revision to the Context PVC. Moca freezes the revision, downloads the frozen revision as a portable bundle streamed by a read-only helper Pod, and deletes the Context when it is no longer needed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .note { font-size: 12px; fill: #1f2937; }
    .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
    .step circle { fill: #1f2937; }
    .step text { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="1180" height="650" rx="12" fill="#ffffff"/>

  <!-- Moca -->
  <rect class="box" x="20" y="60" width="220" height="380" rx="10" fill="#fff4e5" stroke="#d08c2c"/>
  <text class="title" x="130" y="242" text-anchor="middle">Moca</text>
  <text class="sub" x="130" y="262" text-anchor="middle">authenticates and authorizes</text>

  <!-- Client -->
  <rect class="box" x="20" y="500" width="220" height="90" rx="10" fill="#eef4ff" stroke="#4a6fa5"/>
  <text class="title" x="130" y="538" text-anchor="middle">Client</text>
  <text class="sub" x="130" y="558" text-anchor="middle">local agent's helper</text>

  <!-- Context Service -->
  <rect class="box" x="600" y="20" width="560" height="590" rx="14" fill="#f4fbf6" stroke="#3c8d5a"/>
  <text class="title" x="624" y="50">Context Service</text>

  <rect class="box" x="620" y="70" width="200" height="370" rx="10" fill="#ffffff" stroke="#3c8d5a"/>
  <text class="title" x="720" y="238" text-anchor="middle">Context API</text>
  <text class="sub" x="720" y="258" text-anchor="middle">binds each token</text>
  <text class="sub" x="720" y="274" text-anchor="middle">to one Context PVC</text>

  <rect class="box" x="930" y="70" width="210" height="130" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="title" x="1035" y="104" text-anchor="middle">Helper Pod</text>
  <text class="sub" x="1035" y="126" text-anchor="middle">upload: validates and expands</text>
  <text class="sub" x="1035" y="144" text-anchor="middle">export: mounts PVC read-only</text>
  <text class="sub" x="1035" y="162" text-anchor="middle">deleted after each use</text>

  <path class="box" d="M930,400 v58 a105,12 0 0,0 210,0 v-58" fill="#eaf7ee" stroke="#3c8d5a"/>
  <ellipse class="box" cx="1035" cy="400" rx="105" ry="12" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="1035" y="436" text-anchor="middle">Context PVC</text>
  <text class="sub" x="1035" y="454" text-anchor="middle">immutable revisions</text>

  <!-- Moca -> Context API -->
  <line class="line" x1="240" y1="90" x2="618" y2="90"/>
  <g class="step"><circle cx="262" cy="90" r="10"/><text x="262" y="90">1</text></g>
  <text class="api" x="280" y="84">POST /internal/v1/contexts</text>
  <text class="sub" x="280" y="106">create Context and PVC</text>

  <line class="line" x1="240" y1="136" x2="618" y2="136"/>
  <g class="step"><circle cx="262" cy="136" r="10"/><text x="262" y="136">2</text></g>
  <text class="api" x="280" y="130">POST {ctx}/upload-capabilities</text>
  <text class="sub" x="280" y="152">request upload capability</text>

  <line class="line reply" x1="618" y1="182" x2="242" y2="182"/>
  <g class="step"><circle cx="262" cy="182" r="10"/><text x="262" y="182">2</text></g>
  <text class="api" x="280" y="176">201 uploadUrl + token</text>
  <text class="sub" x="280" y="198">one use, expires in 5 min</text>

  <line class="line" x1="240" y1="228" x2="618" y2="228"/>
  <g class="step"><circle cx="262" cy="228" r="10"/><text x="262" y="228">6</text></g>
  <text class="api" x="280" y="222">POST /internal{ctx}/freeze</text>
  <text class="sub" x="280" y="244">pin the uploaded revision</text>

  <line class="line reply" x1="618" y1="274" x2="242" y2="274"/>
  <g class="step"><circle cx="262" cy="274" r="10"/><text x="262" y="274">6</text></g>
  <text class="api" x="280" y="268">200 frozenRevision</text>
  <text class="sub" x="280" y="290">later uploads are rejected</text>

  <line class="line" x1="240" y1="320" x2="618" y2="320"/>
  <g class="step"><circle cx="262" cy="320" r="10"/><text x="262" y="320">7</text></g>
  <text class="api" x="280" y="314">GET /internal{ctx}/revisions/{sha}/bundle</text>
  <text class="sub" x="280" y="336">download the frozen revision</text>

  <line class="line reply" x1="618" y1="366" x2="242" y2="366"/>
  <g class="step"><circle cx="262" cy="366" r="10"/><text x="262" y="366">7</text></g>
  <text class="api" x="280" y="360">200 application/vnd.rossoctl.context</text>
  <text class="sub" x="280" y="382">streamed; aborts if export fails</text>

  <line class="line" x1="240" y1="412" x2="618" y2="412"/>
  <g class="step"><circle cx="262" cy="412" r="10"/><text x="262" y="412">8</text></g>
  <text class="api" x="280" y="406">DELETE /internal{ctx}</text>
  <text class="sub" x="280" y="428">delete Context and PVC</text>

  <!-- Moca -> client handoff -->
  <line class="line reply" x1="130" y1="440" x2="130" y2="498"/>
  <g class="step"><circle cx="130" cy="466" r="10"/><text x="130" y="466">2</text></g>
  <text class="note" x="148" y="463">upload URL + token</text>
  <text class="sub" x="148" y="479">no service token or PVC name</text>

  <!-- Client upload -->
  <path class="line" d="M240,545 H720 V442"/>
  <g class="step"><circle cx="262" cy="545" r="10"/><text x="262" y="545">3</text></g>
  <text class="api" x="280" y="539">PUT /v1/uploads/{id}</text>
  <text class="sub" x="280" y="561">Bearer token + .context bundle</text>

  <!-- Context API <-> helper Pod -->
  <line class="line" x1="820" y1="95" x2="928" y2="95"/>
  <g class="step"><circle cx="842" cy="95" r="10"/><text x="842" y="95">4</text></g>
  <text class="note" x="858" y="89">bundle</text>

  <line class="line reply" x1="928" y1="135" x2="822" y2="135"/>
  <g class="step"><circle cx="842" cy="135" r="10"/><text x="842" y="135">5</text></g>
  <text class="note" x="858" y="129">digest</text>

  <line class="line reply" x1="928" y1="175" x2="822" y2="175"/>
  <g class="step"><circle cx="842" cy="175" r="10"/><text x="842" y="175">7</text></g>
  <text class="note" x="858" y="169">bundle</text>

  <!-- helper Pod <-> PVC -->
  <line class="line" x1="985" y1="200" x2="985" y2="386"/>
  <g class="step"><circle cx="985" cy="260" r="10"/><text x="985" y="260">4</text></g>
  <text class="note" x="903" y="290">write revision</text>

  <line class="line reply" x1="1085" y1="386" x2="1085" y2="202"/>
  <g class="step"><circle cx="1085" cy="320" r="10"/><text x="1085" y="320">7</text></g>
  <text class="note" x="1003" y="350">read frozen</text>

  <text class="api" x="20" y="632" style="font-size: 11px; fill: #6b7280;">{ctx} = /v1/namespaces/{ns}/contexts/{name}</text>
</svg>
